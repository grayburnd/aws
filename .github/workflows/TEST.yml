name: Test

on: workflow_dispatch

jobs:
  test:
    environment: 
      name: prod
      deployment: false #need environment vars/secrets but isn't actually deploying anything
    runs-on: ubuntu-latest
    steps:
        - env:
            VARS_JSON: ${{ toJson(vars) }}
          run: |
            # only TF_VAR_ keys get their suffix lowercased, to match tf var names; other vars pass through unchanged
            jq -c 'to_entries[] | {key: (if (.key | startswith("TF_VAR_")) then "TF_VAR_" + (.key[7:] | ascii_downcase) else .key end), value: .value}' <<< "$VARS_JSON" |
            while IFS= read -r entry; do
              key=$(jq -r '.key' <<< "$entry")
              value=$(jq -r '.value' <<< "$entry")
              delim="GHA_EOF_$(date +%s%N)_$RANDOM"
              {
                echo "${key}<<${delim}"
                echo "${value}"
                echo "${delim}"
              } >> "$GITHUB_ENV"
            done
        - run: |
            env