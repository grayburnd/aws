name: Test

on: workflow_dispatch

jobs:
  test:
    environment: 
      name: prod
      deployment: false #need environment vars/secrets but isn't actually deploying anything
    runs-on: ubuntu-latest
    steps:
        - run: |
            cat <<EOF > example.json
            ${{ toJson(vars) }}
            EOF
            # lowercase everything after the TF_VAR_ prefix in each key, then export key=value
            # (uses the multiline-safe GITHUB_ENV heredoc format since some values contain newlines)
            jq -c 'to_entries[] | {key: (.key[0:7] + (.key[7:] | ascii_downcase)), value: .value}' example.json |
            while IFS= read -r entry; do
              key=$(jq -r '.key' <<< "$entry")
              value=$(jq -r '.value' <<< "$entry")
              delim="GHA_EOF_$(date +%s%N)_$RANDOM"
              {
                echo "${key}<<${delim}"
                echo "${value}"
                echo "${delim}"
              } >> "$GITHUB_ENV"
            done
        - run: |
            env