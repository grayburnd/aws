name: Test

on: workflow_dispatch

jobs:
  test:
    environment: 
      name: prod
      deployment: false #need environment vars/secrets but isn't actually deploying anything
    runs-on: ubuntu-latest
    steps:
        - run: |
            cat <<EOF > example.json
            ${{ toJson(vars) }}
            EOF
            for var in $(cat example.json | jq -r 'to_entries[] | "\(.key)=\(.value)" | "\(.[0:6])\(.[6:index("=")] | ascii_downcase)\(.[index("="):])"'); 
              do echo $var; 
            done
        - run: |
            env